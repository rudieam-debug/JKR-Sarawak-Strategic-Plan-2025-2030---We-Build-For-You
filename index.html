
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://ik.imagekit.io/z7yhsbzej/7227f37e-0954-4095-88b0-0c8b05995132%20(1).png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JKR SARAWAK MOVING FORWARD STRATEGY 2025-2030</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Force dark theme for the new modern, exclusive look
      document.documentElement.classList.add('dark');
      localStorage.setItem('theme', 'dark');
      
      // Define the new, extended theme for Tailwind CSS
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // JKR Modern Red & Gold Accents
              'primary': '#E31837', 
              'primary-hover': '#C4122C',
              'accent': '#FACC15', // Gold/Yellow for highlights
              
              // Deep modern dark theme palette
              'background': '#0F172A', // Slate 900
              'surface': '#1E293B',     // Slate 800
              'surface-light': '#334155', // Slate 700
              'surface-lighter': '#475569', // Slate 600
              
              'border': 'rgba(148, 163, 184, 0.1)', // Subtle border
              'border-hover': 'rgba(148, 163, 184, 0.2)',
              
              'text-primary': '#F8FAFC', // Slate 50
              'text-secondary': '#94A3B8', // Slate 400
              'text-muted': '#64748B',   // Slate 500
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'marquee': 'marquee 30s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
                marquee: {
                    '0%': { transform: 'translateX(0%)' },
                    '100%': { transform: 'translateX(-50%)' },
                },
                float: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-10px)' },
                }
            },
            boxShadow: {
                'glow-primary': '0 0 20px 0 rgba(227, 24, 55, 0.3)',
                'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                'neumorphic': '20px 20px 60px #0d1323, -20px -20px 60px #111b31',
            },
            backdropBlur: {
                'xs': '2px',
            }
          },
        },
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
      
      body {
        background-color: #0F172A;
        /* Modern subtle gradient background */
        background-image: 
          radial-gradient(circle at 15% 50%, rgba(227, 24, 55, 0.08), transparent 25%),
          radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 25%);
        background-attachment: fixed;
        color: #94A3B8;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Custom scrollbar for a modern look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      
      /* Glassmorphism Utility */
      .glass-panel {
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }

      .glass-button {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.2s ease;
      }
      .glass-button:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .skip-link {
        position: absolute;
        top: -100px;
        left: 0;
        background: #E31837; 
        color: white;
        padding: 12px 24px;
        z-index: 10000;
        transition: top 0.3s ease-in-out;
        border-bottom-right-radius: 8px;
        font-weight: 600;
      }
      .skip-link:focus {
        top: 0;
      }

      /* Prose styles for markdown content */
      .prose {
          color: #94A3B8;
      }
      .dark .prose-invert {
          color: #94A3B8;
      }
      .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
          color: #F8FAFC;
          font-weight: 700;
      }
      .prose a {
          color: #E31837;
          text-decoration: none;
          border-bottom: 1px dotted #E31837;
      }
      .prose a:hover {
          border-bottom-style: solid;
      }
      .prose strong {
          color: #F8FAFC;
          font-weight: 600;
      }
      .prose code {
          color: #E31837;
          background-color: rgba(30, 41, 59, 0.5);
          padding: 0.2em 0.4em;
          border-radius: 0.375rem;
          border: 1px solid rgba(255,255,255,0.05);
      }
      .prose blockquote {
          border-left-color: #E31837;
          color: #cbd5e1;
          background: rgba(30, 41, 59, 0.3);
          padding: 1rem;
          border-radius: 0 0.5rem 0.5rem 0;
      }
       .prose table {
        border-color: #334155;
      }
      .prose th, .prose td {
        border-color: #334155;
        padding: 0.75rem;
      }

      /* Styles for Color Editor Mode */
      .color-edit-mode [data-color-id] {
        cursor: pointer !important;
        outline: 2px dashed rgba(227, 24, 55, 0.3);
        outline-offset: 2px;
        transition: all 0.2s;
      }

      .color-edit-mode [data-color-id]:hover {
          outline: 2px solid #E31837;
          background-color: rgba(227, 24, 55, 0.1);
      }
      
      /* Text Selection */
      ::selection {
        background: rgba(227, 24, 55, 0.3);
        color: #ffffff;
      }
    </style>
